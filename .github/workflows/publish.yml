name: Publish to PyPI and the MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'index-latest'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing and MCP Registry GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
