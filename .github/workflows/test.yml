name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Lint and format
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run mypy ideation_goat
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=80

  eval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ideation-goat/models
          key: embedding-model-${{ hashFiles('ideation_goat/config.py') }}
      - name: Download the published index
        id: index
        run: |
          if uv run ideation-goat index pull; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::No published index yet; skipping the retrieval eval."; fi
      - name: Retrieval eval (fails if Recall@5 drops more than 2 points)
        if: steps.index.outputs.ready == 'true'
        run: uv run ideation-goat eval --baseline evals/baseline.json
