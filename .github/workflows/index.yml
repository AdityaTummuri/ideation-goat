name: Rebuild search index

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Build the index from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run ideation-goat index build --pack index.tar.gz
      - name: Check retrieval quality before publishing
        run: uv run ideation-goat eval --baseline evals/baseline.json --out eval-report.json
      - name: Publish as the index-latest release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view index-latest >/dev/null 2>&1 || \
            gh release create index-latest --title "Search index" --latest=false \
              --notes "Prebuilt repo index, rebuilt weekly. Downloaded automatically by ideation-goat."
          gh release upload index-latest index.tar.gz eval-report.json --clobber
