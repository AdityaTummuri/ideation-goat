[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideation-goat"
version = "0.1.0"
description = "Cross-domain ideation MCP server: codebase matching, academic literature search (Semantic Scholar, arXiv) and patent search (Google Patents via SerpApi)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "chromadb>=1.5.9",
    "mcp>=1.28.1,<2",
    "pygithub>=2.9.1",
    "pyjwt>=2.8",
    "python-dotenv>=1.2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
ui = ["streamlit>=1.59.2"]
dev = ["black", "pytest", "ruff"]

[project.scripts]
ideation-goat = "ideation_goat.server:main"

[tool.setuptools.packages.find]
include = ["ideation_goat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293"]
